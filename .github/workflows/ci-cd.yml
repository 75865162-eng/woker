name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the CI-built artifact to production
        required: true
        type: boolean
        default: false
      base_sha:
        description: Exact commit currently running on production
        type: string
        required: true
      target_host:
        description: Explicit production target (empty uses configured production host)
        type: choice
        options:
          - ""
          - "159.75.203.221"
          - "123.207.47.225"
        default: ""
      deployment_reviewed:
        description: Deployment infrastructure and database migrations have been manually reviewed
        type: boolean
        default: false
      install_dependencies:
        description: Allow npm ci on the server for a lockfile change or first install
        type: boolean
        default: false
      initial_deployment:
        description: Initialize a clean Ubuntu host with no previous release
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance-regression:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (!inputs.initial_deployment || !inputs.deploy_production))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Prepare disposable database image
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7

      # 基准测的是固定 base commit 的性能；同一 BASE_SHA + 相同依赖/基准脚本的结果
      # 是确定的，缓存后重复 run 直接命中，省去 ~196s 的基准实测。
      - name: Cache base performance baseline
        id: perf-baseline-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/erp-performance-baseline.json
          key: erp-perf-baseline-${{ github.event.pull_request.base.sha || inputs.base_sha }}-${{ hashFiles('package-lock.json', 'scripts/performance/**') }}

      - name: Measure base revision
        if: steps.perf-baseline-cache.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/erp-performance-base"
          mkdir -p "$baseline_dir"
          git archive "$BASE_SHA" | tar -x -C "$baseline_dir"
          node scripts/performance/erp-navigation.mjs \
            --mode=production \
            --output="$RUNNER_TEMP/erp-performance-baseline.json" \
            --source-dir="$baseline_dir"

      - name: Enforce performance budget
        run: |
          node scripts/performance/erp-navigation.mjs \
            --mode=production \
            --output="$RUNNER_TEMP/erp-performance-candidate.json" \
            --baseline="$RUNNER_TEMP/erp-performance-baseline.json"

  build:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tier: ${{ steps.tier.outputs.tier }}
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze release impact
        id: plan
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/deployment-plan.mjs

      - name: Classify change tier
        id: tier
        if: steps.plan.outputs.release == 'true'
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/change-tier.mjs

      - name: Enforce deployment review
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_production && steps.plan.outputs.manual_review == 'true' && !inputs.deployment_reviewed
        run: echo 'Deployment infrastructure changes require explicit review.' >&2; exit 1

      - name: Setup Node.js
        if: steps.plan.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        if: steps.plan.outputs.release == 'true'
        run: npm ci

      # Next.js 构建缓存：distDir 由 build 脚本指向 .next-build，缓存其 webpack/编译
      # 中间产物。key 含 lockfile 与源码 hash，源码变更自然失效；restore-keys 兜底复用
      # 同依赖版本的最近缓存，避免缓存污染（失效条件不依赖易变的运行期文件）。
      - name: Cache Next.js build
        if: steps.plan.outputs.release == 'true'
        uses: actions/cache@v4
        with:
          path: .next-build/cache
          key: ${{ runner.os }}-nextbuild-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-${{ hashFiles('src/**', 'prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-nextbuild-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-

      - name: Generate Prisma Client
        if: steps.plan.outputs.release == 'true'
        run: npm run db:generate

      - name: Validate Prisma schema
        if: steps.plan.outputs.release == 'true'
        run: npx --no-install prisma validate

      - name: Typecheck
        if: steps.plan.outputs.release == 'true'
        run: npm run typecheck

      - name: UI regression guard
        if: steps.plan.outputs.release == 'true'
        run: npm run ui:guard

      - name: Cache Playwright browsers
        if: steps.plan.outputs.release == 'true' && steps.tier.outputs.tier == 'full'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install test browser
        if: steps.plan.outputs.release == 'true' && steps.tier.outputs.tier == 'full'
        run: npx playwright install --with-deps chromium

      - name: Test (full suite)
        if: steps.plan.outputs.release == 'true' && steps.tier.outputs.tier == 'full'
        run: npm run test

      - name: Test (changed scope)
        if: steps.plan.outputs.release == 'true' && steps.tier.outputs.tier == 'fast'
        run: node scripts/runtime/run-unit-tests-changed.mjs

      - name: Lint
        if: steps.plan.outputs.release == 'true'
        run: npm run lint

      - name: Supply-chain audit (baseline + new-finding gate)
        if: steps.plan.outputs.release == 'true'
        run: npm run audit:deps

      - name: Build
        if: steps.plan.outputs.release == 'true'
        env:
          # 页面规模扩大后 Next.js 构建峰值堆超过 Node 默认 4GB（CI 实测 OOM），
          # 与本地 --max-old-space-size=6144 验证通过的配置保持一致。
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Package release artifact
        if: steps.plan.outputs.release == 'true'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RELEASE_LINT_STATUS: passed
          RELEASE_TEST_STATUS: passed
          RELEASE_BUILD_STATUS: passed
          RELEASE_TEST_TIER: ${{ steps.tier.outputs.tier }}
          RELEASE_TEST_SCOPE: ${{ steps.tier.outputs.test_count }}
        run: bash scripts/package-ci-artifact.sh

      - name: Check release artifact
        if: steps.plan.outputs.release == 'true'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: bash scripts/release-check.sh dist/amazon-ad-bulk-operation-release.tar.gz

      - name: Upload release artifact
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: amazon-ad-bulk-operation-release
          path: |
            dist/amazon-ad-bulk-operation-release.tar.gz
            dist/release-manifest.json
            dist/release-check.json
            dist/deployment-plan.json
          if-no-files-found: error
          retention-days: 14

  # 运行时集成测试自行构建隔离产物（.next-dev-runtime-*），不依赖 build job 的
  # release artifact，因此与 build / performance-regression 并行执行，避免串行等待。
  # 它仍是全局基础门禁：deploy-production 显式 needs 本 job 成功。
  runtime-integration:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (!inputs.initial_deployment || !inputs.deploy_production))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
        run: npm run db:generate

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install fixture browser
        run: npx playwright install --with-deps chromium

      - name: Prepare disposable images
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7

      - name: Verify isolated runtime and recovery
        run: npm run test:runtime:integration

  deploy-production:
    needs: [build, performance-regression, runtime-integration]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.deploy_production && needs.build.result == 'success' && needs.runtime-integration.result == 'success' && needs.build.outputs.release == 'true' && (needs.performance-regression.result == 'success' || (inputs.initial_deployment && needs.performance-regression.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: amazon-ad-bulk-operation-release
          path: dist

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ inputs.target_host || secrets.PRODUCTION_SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy artifact
        env:
          SERVER_HOST: ${{ inputs.target_host || secrets.PRODUCTION_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
          SERVER_DIR: ${{ secrets.PRODUCTION_SERVER_DIR }}
          # 连接建立上限 10s × 3 次 = 30s 内明确失败；已建立连接静默 15s×2=30s 判定挂死。
          # BatchMode 禁止交互式口令提示，避免跨境链路抖动时无限等待。
          # 连接复用/压缩由 deploy-ci-artifact.sh 追加（ControlMaster/scp -C）。
          SSH_OPTS: -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=2
          INSTALL_DEPS_ON_SERVER: ${{ inputs.install_dependencies && 'true' || 'false' }}
          INITIAL_DEPLOYMENT: ${{ inputs.initial_deployment && 'true' || 'false' }}
          RUN_BOOTSTRAP_SEED: "false"
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        # tee 将完整发布日志落盘供自动报告解析；pipefail 保证 deploy 脚本失败时 step 仍失败，
        # 不因管道末段 tee 成功而掩盖发布失败（可靠性不妥协）。
        run: |
          set -o pipefail
          bash scripts/deploy-ci-artifact.sh dist/amazon-ad-bulk-operation-release.tar.gz 2>&1 | tee dist/deploy-console.log

      - name: Collect CI job timings
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        # 有上限的 API 读取（单次 curl，失败写空对象兜底），不使用 sleep 盲等。
        run: |
          node - "$RUN_ID" "$GH_TOKEN" <<'NODE' > dist/ci-job-timings.json || echo '{"jobs":[]}' > dist/ci-job-timings.json
          const [runId, token] = process.argv.slice(2);
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}/jobs?per_page=100`;
          fetch(url, { headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" } })
            .then(r => r.ok ? r.json() : Promise.reject(new Error("jobs api " + r.status)))
            .then(d => process.stdout.write(JSON.stringify({ jobs: d.jobs || [] })))
            .catch(() => process.stdout.write('{"jobs":[]}'));
          NODE

      - name: Generate deployment report
        if: ${{ !cancelled() }}
        # 自动汇总报告写入 job summary，无需人工拼装；报告脚本只读既有证据，不触碰发布契约。
        run: node scripts/deployment-report.mjs --output "$GITHUB_STEP_SUMMARY"
