<div id="asc-prototype" aria-label="Amazon 数据同步中心评审原型">

</div>
<script>
(()=>{
const root=document.getElementById('asc-prototype'), content=root.querySelector('#asc-content'), notice=root.querySelector('#asc-notice');
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pages=[['overview','数据总览','layout-dashboard'],['plans','同步计划','calendar-clock'],['tasks','同步任务','list-checks'],['domains','数据域管理','database'],['quality','数据质量','shield-check'],['connections','店铺与授权','key-round'],['settings','同步设置','settings-2']];
const domains=[['inventory','FBA 库存','商品与库存',true,'FBA Inventory v1 · getInventorySummaries','每 60 分钟'],['catalog','在线商品','商品与库存',true,'Listings Items 2021-08-01 · searchListingsItems','每 24 小时'],['fbm','FBM 库存','商品与库存',false,'Listings 履约数量 · 待核验','待配置'],['inbound','FBA 在途货件','商品与库存',false,'Fulfillment Inbound · 待冻结版本','每 2 小时'],['orders','订单','订单与经营',false,'Orders 2026-01-01 · 待试点核验','每 15 分钟'],['items','订单商品','订单与经营',false,'随订单版本与 includedData 核验','随订单'],['traffic','销售与流量日报','订单与经营',false,'Reports · GET_SALES_AND_TRAFFIC_REPORT','每天＋7 天回查'],['finance','财务交易','财务与售后',false,'Finances 2024-06-19 · listTransactions','每 6 小时'],['settlement','结算报告','财务与售后',false,'Reports · 发现系统生成的结算报告','每天'],['returns','退货','财务与售后',false,'Reports · 当前报告资格待核验','每天'],['reimburse','赔偿','财务与售后',false,'Reports / 财务对账 · 待核验','每天'],['age','库龄','财务与售后',false,'Reports · 快照分桶待核验','每天'],['price','商品价格','价格与竞争',false,'Product Pricing · 重点 ASIN','每 30–60 分钟'],['offer','Featured Offer / Buy Box','价格与竞争',false,'Product Pricing · 响应字段待核验','待配置'],['brand','搜索词与品牌分析','品牌分析',false,'Reports · 按可用完整周期','按报告周期']];
const scopes=[{store:'a',site:'US',seller:'演示店铺 A'},{store:'a',site:'CA',seller:'演示店铺 A'},{store:'b',site:'US',seller:'演示店铺 B'}];
let state={page:'overview',domain:'inventory',store:'all',site:'all',task:null,filterStatus:'all',filterDomain:'all',filterType:'all',filterDate:'all',quality:null};
const plans={inventory:{name:'FBA 库存 · 常规快照',frequency:'60',enabled:true,mode:'snapshot',priority:'P0',retries:'3',retention:'30'},catalog:{name:'在线商品 · 每日校准',frequency:'1440',enabled:true,mode:'snapshot',priority:'P0',retries:'3',retention:'30'}};
let tasks=[{id:'DEMO-1042',store:'a',site:'US',domain:'inventory',status:'执行中',stage:'分页采集',type:'定时同步',at:'09:57',date:'2026-11-04',records:840,pages:42,requests:43,throttles:0,attempts:1,elapsed:'3分00秒',coverage:'全量快照 · 尚未发布'},{id:'DEMO-1041',store:'b',site:'US',domain:'catalog',status:'失败',stage:'校验失败',type:'定时同步',at:'09:40',date:'2026-11-04',records:120,pages:6,requests:7,throttles:0,attempts:1,elapsed:'1分18秒',coverage:'未发布 · 保留旧快照'},{id:'DEMO-1040',store:'a',site:'CA',domain:'inventory',status:'成功',stage:'已发布',type:'手动同步',at:'09:35',date:'2026-11-04',records:622,pages:32,requests:33,throttles:1,attempts:2,elapsed:'2分10秒',coverage:'完整快照 · 622 条'},{id:'DEMO-1039',store:'a',site:'US',domain:'catalog',status:'成功',stage:'已发布',type:'定时同步',at:'09:20',date:'2026-11-04',records:1234,pages:62,requests:63,throttles:0,attempts:1,elapsed:'3分42秒',coverage:'完整快照 · 1,234 条'},{id:'DEMO-1038',store:'b',site:'US',domain:'inventory',status:'成功',stage:'已发布',type:'定时同步',at:'02:00',date:'2026-11-04',records:312,pages:16,requests:17,throttles:0,attempts:1,elapsed:'1分02秒',coverage:'完整快照 · 已过新鲜度阈值'}];
const issues=[{id:'Q-01',store:'b',site:'US',domain:'catalog',kind:'关键字段缺失',impact:'1 页 · Seller SKU 缺失',advice:'检查适配器与源响应，校验修复后重试',task:'DEMO-1041'},{id:'Q-02',store:'b',site:'US',domain:'inventory',kind:'数据过期',impact:'312 条 · 快照已 8 小时',advice:'检查 Worker 和计划，触发新的完整快照',task:'DEMO-1038'}];
const currentScopes=()=>scopes.filter(x=>(state.store==='all'||x.store===state.store)&&(state.site==='all'||x.site===state.site));
const matches=x=>(state.store==='all'||x.store===state.store)&&(state.site==='all'||x.site===state.site);
const dn=k=>domains.find(x=>x[0]===k)?.[1]||k;
const badge=(v)=>`<span class="pill ${v==='成功'||v==='正常'||v==='已接入'?'good':v==='失败'||v==='关键字段缺失'?'bad':v==='过期'||v==='数据过期'?'warn':v==='规划中'?'neutral':''}">${esc(v)}</span>`;
const btn=(label,action,value='',primary=false,disabled=false)=>`<button type="button" class="${primary?'primary ':''}cursor-interaction" data-action="${action}" data-value="${esc(value)}" ${disabled?'disabled':''}>${esc(label)}</button>`;
const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${heads.length}" class="empty">此范围暂无演示数据</td></tr>`}</tbody></table></div>`;
const panel=(title,body,extra='')=>`<section class="panel"><div class="panel-head"><h2>${title}</h2>${extra}</div>${body}</section>`;
function say(t){notice.textContent=t;}
function select(label,id,options,value){return `<label>${esc(label)}<select id="${id}">${options.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;}
function health(){return currentScopes().flatMap(s=>domains.filter(d=>d[3]).map(d=>{let latest=tasks.find(t=>t.store===s.store&&t.site===s.site&&t.domain===d[0]);let success=tasks.find(t=>t.store===s.store&&t.site===s.site&&t.domain===d[0]&&t.status==='成功');return {...s,domain:d[0],latest,success,status:latest?.status==='执行中'?'同步中':latest?.status==='失败'?'失败':success?.at==='02:00'?'过期':success?'正常':'待首次同步'};}));}
function metric(label,value,sub){return `<div class="metric"><span class="muted">${label}</span><strong>${value}</strong><small>${sub}</small></div>`;}
function renderOverview(){let ts=tasks.filter(matches), hs=health(), is=issues.filter(matches), success=ts.find(t=>t.status==='成功');let metrics=metric('已连接店铺',new Set(currentScopes().map(x=>x.store)).size,'演示授权可用店铺')+metric('已启用数据域',Object.values(plans).filter(p=>p.enabled).length,'当前已实现的 2 个域')+metric('当前运行任务',ts.filter(t=>t.status==='执行中').length,'不含排队和报告等待')+metric('待处理异常',is.length,'按问题去重')+metric('过期作用域',hs.filter(x=>x.status==='过期').length,'店铺 × 站点 × 数据域')+metric('最近成功同步',success?success.at:'—','不含连接验证');
let rows=hs.map(x=>`<tr><td><button class="link cursor-interaction" data-action="domain" data-value="${x.domain}">${dn(x.domain)}</button><small>${x.seller} / ${x.site}</small></td><td>${x.success?.at||'—'}</td><td>${x.success?esc(x.success.coverage):'尚无已发布快照'}</td><td>${badge(x.status)}</td><td>${plans[x.domain]?.enabled?(x.domain==='inventory'?'10:35':'明日 09:20'):'已暂停'}</td></tr>`);
let vals=[8,11,7,10,9,12,8,10,11,9,12,8], scopedScale=Math.max(1,currentScopes().length);let chart=`<div class="pad"><div class="muted">任务数 / 2 小时桶 · 成功 ■　失败 ▪</div><div class="trend" role="img" aria-label="过去24小时演示任务趋势，按2小时分桶">${vals.map((v,i)=>`<div class="trend-col"><span style="height:${v*5}%" data-tooltip="成功 ${v*scopedScale} 次"></span><span class="failure" style="height:${i===6||i===10?18:0}%" data-tooltip="失败 ${i===6||i===10?scopedScale:0} 次"></span></div>`).join('')}</div><div class="trend-axis"><span>昨日 10:00</span><span>22:00</span><span>今日 10:00</span></div><div class="note">执行耗时 P95：3分42秒 · API 限流：${ts.reduce((a,t)=>a+t.throttles,0)} 次<br>演示聚合，实际值由服务端全量任务统计。</div></div>`;
content.innerHTML=`<div class="metrics">${metrics}</div>${panel('数据同步健康状态',table(['数据域 / 范围','最近成功','覆盖范围','当前状态','下次同步'],rows),btn('配置计划','nav','plans'))}<div class="two">${panel('最近 24 小时任务趋势',chart)}${panel('需要处理',`<div class="pad">${is.map(x=>`<div class="alert-row">${badge(x.kind)}<div>${dn(x.domain)} · 演示店铺 ${x.store.toUpperCase()} / ${x.site}</div><small class="muted">${x.impact}</small><br>${btn('查看关联任务 →','task',x.task)}</div>`).join('')||'<div class="empty">此范围暂无异常</div>'}</div>`)}</div><div class="muted">订单、销售流量、财务等尚未接入；在数据域管理中显示为规划中。</div>`;}
function domainList(){return `<div class="domain-list" aria-label="数据域选择">${domains.map(d=>`<button class="cursor-interaction" data-action="choose-domain" data-value="${d[0]}" aria-pressed="${state.domain===d[0]}"><span>${d[1]}</span>${d[3]?'':badge('规划中')}</button>`).join('')}</div>`;}
function renderPlans(){let d=domains.find(x=>x[0]===state.domain),p=plans[d[0]]||{name:d[1]+' · 计划草案',frequency:d[0]==='orders'?'15':'1440',mode:['traffic','settlement','returns','age','reimburse','brand'].includes(d[0])?'report':'incremental',enabled:false,priority:'P1',retries:'3',retention:'30'};let report=p.mode==='report'||['traffic','settlement','returns','age','reimburse','brand'].includes(d[0]);let fields=`<div class="form-grid"><label class="full">计划名称<input id="asc-plan-name" value="${esc(p.name)}" maxlength="80" required></label>${select('启用状态','asc-enabled',[['yes','已启用'],['no','已暂停']],p.enabled?'yes':'no')}${select('同步频率','asc-frequency',[['15','每 15 分钟'],['30','每 30 分钟'],['60','每小时'],['360','每 6 小时'],['1440','每天'],['custom','自定义周期']],p.frequency)}<label id="asc-custom-wrap" ${p.frequency==='custom'?'':'hidden'}>自定义分钟<input id="asc-custom" type="number" min="15" max="10080" value="${p.custom||120}"></label>${select('同步模式','asc-mode',[['snapshot','全量快照 / 校准'],['incremental','时间窗增量（待核验能力）'],['report','异步报告']],p.mode)}${select('任务优先级','asc-priority',[['P0','P0 · 实时关键'],['P1','P1 · 日常经营'],['P2','P2 · 售后'],['P3','P3 · 监控']],p.priority)}${select('计划时区','asc-timezone',[['America/Los_Angeles','America/Los_Angeles'],['America/Toronto','America/Toronto'],['Asia/Shanghai','Asia/Shanghai']],'America/Los_Angeles')}<label>适用范围<input readonly value="${esc(currentScopes().map(x=>x.seller+'/'+x.site).join('、')||'空范围')}"></label><label>最多尝试次数<input id="asc-retries" type="number" min="1" max="10" value="${p.retries}"></label><label>快照历史保留（天）<input id="asc-retention" type="number" min="1" max="3650" value="${p.retention}"></label><label>同步起始日期<input id="asc-from" type="date" value="2026-10-28"></label><label>同步结束日期<input id="asc-to" type="date" value="2026-11-03"></label></div><div id="asc-report-fields" ${report?'':'hidden'}><div class="note">报告策略 · 仅展示未来配置，不表示已接入</div><div class="form-grid"><label>回查最近完整天数<input type="number" id="asc-lookback" min="1" max="90" value="7"></label>${select('补偿策略','asc-compensate',[['missing','缺日补取＋失败重试'],['review','人工审核后重申请']],'missing')}<label>可接受源延迟（小时）<input type="number" min="1" value="24"></label><label>报告粒度<input value="DAY / SKU（须核验报告支持）" readonly></label></div></div>`;
content.innerHTML=`<div class="split">${domainList()}<div>${panel(`${d[1]} · ${d[3]?'同步计划':'规划配置'}`,`<form id="asc-plan-form" class="pad">${!d[3]?'<div class="note">此数据域规划中，未实现同步执行器。可以评审字段，不可启用或执行。</div>':''}${fields}<div id="asc-form-error" class="error" role="alert"></div><div class="actions">${btn('保存计划','save-plan','',true,!d[3])}${btn(p.enabled?'暂停计划':'恢复计划','toggle-plan','',false,!d[3])}${btn('立即执行','run','',false,!d[3])}${btn('复制计划','copy-plan','',false,!d[3])}${btn('执行历史','history',d[0])}</div><div class="note">保存仅更新演示状态。暂停只影响未来调度；重试采用指数退避并保留日志。</div></form>`,btn('新建计划','new-plan','',false,!d[3]))}</div></div>`;}
function taskRows(){return tasks.filter(matches).filter(t=>(state.filterStatus==='all'||t.status===state.filterStatus)&&(state.filterDomain==='all'||t.domain===state.filterDomain)&&(state.filterType==='all'||t.type===state.filterType)&&(state.filterDate==='all'||t.date==='2026-11-03'));}
function renderTasks(){let rows=taskRows();content.innerHTML=`<div class="toolbar">${select('数据域','asc-task-domain',[['all','全部域'],...domains.filter(x=>x[3]).map(x=>[x[0],x[1]])],state.filterDomain)}${select('任务状态','asc-task-status',[['all','全部状态'],...['等待执行','排队中','执行中','部分成功','成功','失败','已取消'].map(x=>[x,x])],state.filterStatus)}${select('任务类型','asc-task-type',[['all','全部类型'],['定时同步','定时同步'],['手动同步','手动同步'],['历史回填','历史回填']],state.filterType)}${select('时间范围','asc-task-date',[['all','最近 24 小时'],['previous','昨日']],state.filterDate)}</div>${panel(`同步任务 · ${rows.length} 条演示记录`,table(['任务 / 类型','店铺站点','数据域','状态 / 阶段','开始 / 耗时','记录'],rows.map(t=>`<tr><td><button class="link cursor-interaction" data-action="task" data-value="${t.id}">${t.id}</button><small>${t.type}</small></td><td>演示店铺 ${t.store.toUpperCase()}<small>${t.site}</small></td><td>${dn(t.domain)}</td><td>${badge(t.status)}<small>${t.stage}</small></td><td>${t.at}<small>${t.elapsed}</small></td><td>${t.records.toLocaleString()}</td></tr>`)))}${state.task?taskDetail():''}<details class="panel"><summary class="pad cursor-interaction">未来报表任务状态预览 · 不代表已接入</summary><div class="pad"><div class="steps">${['REQUESTED','IN_PROGRESS','READY','DOWNLOADED','PARSED','VALIDATED','COMPLETED'].map((x,i)=>`<span class="${i<2?'done':i===2?'current':''}">${x}</span>`).join('')}</div>${badge('等待报告下载')}<p class="muted">远端 DONE / 本地 READY。尚未下载、解析、校验、入库，任务不能显示同步成功。</p></div></details>`;}
function taskDetail(){let t=tasks.find(x=>x.id===state.task);if(!t||!matches(t))return '';let fields=[['任务ID',t.id],['店铺 / 站点',`演示店铺 ${t.store.toUpperCase()} / ${t.site}`],['数据域 / 类型',`${dn(t.domain)} / ${t.type}`],['处理 / 新增 / 更新 / 跳过',t.status==='成功'?`${t.records} / 0 / ${t.records} / 0`:`${t.records} / — / — / —`],['请求 / 限流',`${t.requests} / ${t.throttles}`],['执行尝试 / 重试',`${t.attempts} / ${Math.max(0,t.attempts-1)}`],['分页',`已处理 ${t.pages} 页 / 总页数${t.status==='成功'?t.pages:'未知'}`],['数据覆盖',t.coverage],['耗时',t.elapsed]];return panel('任务详情',`<div class="pad"><div class="detail-grid">${fields.map(([l,v])=>`<div><small>${l}</small><strong>${esc(v)}</strong></div>`).join('')}</div><div class="steps"><span class="done">已入队</span><span class="${t.status==='失败'?'':'done'}">分页采集</span><span class="${t.stage==='校验失败'?'current':''}">完整性校验</span><span class="${t.status==='成功'?'done':''}">事务发布</span></div>${t.status==='失败'?'<div class="note">SCHEMA_INVALID：第 6 页缺 Seller SKU，未发布半成品，旧快照保留。</div>':''}<div class="actions">${btn('重试失败任务','retry',t.id,true,t.status!=='失败')}${btn('补偿失败范围','compensate',t.id,false,t.status!=='部分成功')}${btn('取消任务','cancel',t.id,false,!['执行中','排队中','等待执行'].includes(t.status))}</div><h3 style="margin-top:16px">结构日志 · 演示</h3><pre>${t.at}:00  TASK_CLAIMED   task=${t.id}\n${t.at}:01  PAGE_PARSED    pages=${t.pages} rows=${t.records}\n${t.at}:02  ${t.status==='失败'?'VALIDATION_FAILED code=SCHEMA_INVALID':t.status==='成功'?'SNAPSHOT_PUBLISHED cursor_committed=true':'CHECKPOINT_SAVED cursor_committed=false'}\n无 Token、密钥、买家信息或分页 Token 值</pre></div>`,btn('收起详情','close-task'));}
function renderDomains(){let d=domains.find(x=>x[0]===state.domain),hs=health().filter(x=>x.domain===d[0]),ok=hs.filter(x=>x.success);content.innerHTML=panel('数据域目录',table(['分类','数据域','接入状态','建议策略'],domains.map(x=>`<tr><td>${x[2]}</td><td><button class="link cursor-interaction" data-action="domain" data-value="${x[0]}">${x[1]}</button></td><td>${badge(x[3]?'已接入':'规划中')}</td><td>${x[5]}</td></tr>`)))+panel(`${d[1]} · 数据域详情`,`<div class="pad"><div class="detail-grid">${[['数据说明',d[2]],['API / Report',d[4]],['所需授权','以当前官方角色＋试点检测为准'],['站点',d[3]?(currentScopes().map(x=>x.site).filter((v,i,a)=>a.indexOf(v)===i).join(' / ')||'无'):'尚未核验'],['最近成功',ok[0]?.success?.at||'—'],['记录数量',ok.length?ok.reduce((sum,x)=>sum+x.success.records,0).toLocaleString():'—'],['数据覆盖',ok.length?'逐店铺站点完整快照':'尚无已验证覆盖'],['同步策略',d[5]],['质量状态',d[3]?(issues.some(x=>matches(x)&&x.domain===d[0])?'待处理':'暂无演示问题'):'规划中']].map(([l,v])=>`<div><small>${l}</small><strong>${esc(v)}</strong></div>`).join('')}</div><div class="note">${d[3]?'Amazon 数据仅作为外部校准源；不自动覆盖 ProductRecord 人工主资料。':'未开发的数据域不计入已接入指标，不允许执行同步；当前 API / 报告细则须在实施前冻结。'}</div><div class="actions">${btn('查看同步策略','plans-domain',d[0])}${btn('最近任务','history',d[0])}</div></div>`);}
function renderQuality(){let list=issues.filter(matches);content.innerHTML=`<div class="note">基础校验与新鲜度问题示例。完整质量中心为 Phase 4 设计，未对生产数据执行检查。</div>${panel('数据质量问题',table(['问题 / 严重度','范围','影响','发现时间','处理'],list.map(x=>`<tr><td>${badge(x.kind)}<small>${x.id} · ${x.kind==='数据过期'?'警告':'阻断'}</small></td><td>演示店铺 ${x.store.toUpperCase()} / ${x.site}<small>${dn(x.domain)}</small></td><td>${x.impact}</td><td>11-04 09:45</td><td>${btn('查看证据','issue',x.id)}</td></tr>`)))}${state.quality?issueDetail():''}`;}
function issueDetail(){let x=issues.find(i=>i.id===state.quality);if(!x||!matches(x))return '';return panel('问题证据与建议',`<div class="pad"><p>${badge(x.kind)} ${x.impact}</p><p>${x.advice}</p><div class="detail-grid"><div><small>校验规则版本</small><strong>demo.v1</strong></div><div><small>状态</small><strong>未解决</strong></div><div><small>来源</small><strong>${esc(dn(x.domain))} / ${x.task}</strong></div></div><div class="note">知悉不改变数据新鲜度或完整性，修复后需重新检查。</div>${btn('打开关联任务','task',x.task)}</div>`);}
function renderConnections(){let ss=currentScopes();content.innerHTML=`<div class="note">目标多授权设计。当前真实系统仅一组凭证；下列 A / B 为演示身份，不代表真实授权。</div>${panel('店铺与站点绑定',table(['ERP 店铺','Amazon 卖家 / 区域','站点','授权状态','已检测能力'],ss.map(s=>`<tr><td>${s.seller}</td><td>DEMO-SELLER-${s.store.toUpperCase()}<small>北美区域 / 凭证版本 demo-v1</small></td><td>${s.site}</td><td>${badge('正常')}<small>上次验证 09:00</small></td><td>库存 / 在线商品</td></tr>`)))}${panel('授权管理边界',`<div class="pad"><div class="detail-grid"><div><small>管理权限</small><strong>settings:edit</strong></div><div><small>密文存储</small><strong>AES-256-GCM / 服务端</strong></div><div><small>安全摘要权限</small><strong>operations:view</strong></div></div><div class="note">凭证留在现有集成设置流程，不在原型输入真实密钥。连接验证只证明参与站点可访问，各数据域需独立验证。</div>${btn('查看授权配置流程','auth-info')}</div>`)}`;}
function renderSettings(){content.innerHTML=`${panel('Worker 与队列',`<div class="pad"><div class="detail-grid"><div><small>队列</small><strong>amazon-sync-jobs</strong></div><div><small>Worker 心跳</small><strong>演示在线 · 09:59:50</strong></div><div><small>并发预算</small><strong>当前代码默认 1，上限 2</strong></div></div><div class="note">生产在线状态本次未检查。提高并发会增加 API / PostgreSQL 连接与资源消耗，需容量评审。</div></div>`)}${panel('组织同步策略 · 设计预览',`<div class="pad"><div class="form-grid">${select('默认时区','asc-setting-tz',[['station','按站点 IANA 时区'],['shanghai','Asia/Shanghai']],'station')}${select('重试退避','asc-setting-backoff',[['exp','指数退避＋随机抖动']],'exp')}<label>库存过期阈值（分钟）<input type="number" value="360" min="15"></label><label>日志保留（天，待容量评审）<input type="number" value="30" min="1"></label><label>默认快照保留（天，待评审）<input type="number" value="30" min="1"></label><label>原始文件保留<input value="按域白名单和敏感数据策略" readonly></label></div><div class="note">设置 API 尚未实施。current 快照、运行中任务、未解决问题关联数据不受普通 TTL 清理。通知渠道为规划项。</div>${btn('保存设置（规划中）','noop','',true,true)}</div>`)}`;}
function render(){let p=pages.find(x=>x[0]===state.page);root.querySelector('#asc-title').textContent=p[1];root.querySelector('#asc-subtitle').textContent=({overview:'连接、任务与数据覆盖的统一视图',plans:'按数据域配置频率、范围与运行策略',tasks:'从入队、分页到验证发布的完整过程',domains:'已实现能力与后续规划明确区分',quality:'完整性、新鲜度与数据异常的处理入口',connections:'卖家身份、站点映射及授权能力',settings:'后台执行、资源预算与保留策略'})[state.page];root.querySelector('nav').innerHTML=pages.map(x=>`<button class="cursor-interaction" data-action="nav" data-value="${x[0]}" ${state.page===x[0]?'aria-current="page"':''}><i data-lucide="${x[2]}" aria-hidden="true"></i>${x[1]}</button>`).join('');({overview:renderOverview,plans:renderPlans,tasks:renderTasks,domains:renderDomains,quality:renderQuality,connections:renderConnections,settings:renderSettings})[state.page]();if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});}
function formPlan(){let name=root.querySelector('#asc-plan-name').value.trim(),frequency=root.querySelector('#asc-frequency').value,custom=Number(root.querySelector('#asc-custom').value),retries=Number(root.querySelector('#asc-retries').value),retention=Number(root.querySelector('#asc-retention').value),mode=root.querySelector('#asc-mode').value,from=root.querySelector('#asc-from').value,to=root.querySelector('#asc-to').value;let error=!name?'请填写计划名称。':frequency==='custom'&&(!Number.isInteger(custom)||custom<15||custom>10080)?'自定义周期须为 15–10080 的整数分钟。':!Number.isInteger(retries)||retries<1||retries>10?'尝试次数须为 1–10 的整数。':!Number.isInteger(retention)||retention<1||retention>3650?'保留天数须为 1–3650 的整数。':!currentScopes().length?'请先选择至少一个有效店铺站点。':!from||!to||from>to?'请检查同步日期范围。':mode!=='snapshot'?'当前两个执行器仅验证全量快照，增量/报告需另行实现。':'';root.querySelector('#asc-form-error').textContent=error;if(error)return null;return {name,frequency,custom,retries:String(retries),retention:String(retention),mode,enabled:root.querySelector('#asc-enabled').value==='yes',priority:root.querySelector('#asc-priority').value};}
root.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let {action:a,value:v}=b.dataset;notice.textContent='';if(a==='nav'){state.page=v;state.task=null;}else if(a==='choose-domain'){state.domain=v;}else if(a==='domain'){state.domain=v;state.page='domains';}else if(a==='plans-domain'){state.domain=v;state.page='plans';}else if(a==='history'){state.page='tasks';state.filterDomain=v;state.filterStatus='all';state.task=null;}else if(a==='task'){state.page='tasks';state.task=v;}else if(a==='close-task'){state.task=null;}else if(a==='save-plan'){let p=formPlan();if(!p)return;plans[state.domain]=p;say('已保存演示计划；没有写入服务器，也不会发起同步。');}else if(a==='toggle-plan'){plans[state.domain].enabled=!plans[state.domain].enabled;say('演示计划已'+(plans[state.domain].enabled?'恢复':'暂停')+'；仅影响预览。');}else if(a==='copy-plan'){let p=plans[state.domain];plans[state.domain]={...p,name:p.name+' · 副本',enabled:false};say('已预览停用的计划副本。多计划列表将在 Phase 1 实施。');}else if(a==='new-plan'){plans[state.domain]={name:'未命名计划',frequency:'60',enabled:false,mode:'snapshot',priority:'P0',retries:'3',retention:'30'};say('已打开新建演示草案，填写后可保存预览。');}else if(a==='run'){let p=formPlan();if(!p)return;let s=currentScopes()[0],id='DEMO-'+String(1100+tasks.length);let active=tasks.find(t=>t.store===s.store&&t.site===s.site&&t.domain===state.domain&&['执行中','排队中'].includes(t.status));if(active){state.page='tasks';state.task=active.id;say('该演示作用域已有活动任务，返回原任务，避免重复执行。');}else{tasks.unshift({id,store:s.store,site:s.site,domain:state.domain,status:'排队中',stage:'等待 Worker',type:'手动同步',at:'10:00',date:'2026-11-04',records:0,pages:0,requests:0,throttles:0,attempts:0,elapsed:'尚未开始',coverage:'尚未发布'});state.page='tasks';state.task=id;say('仅模拟创建排队任务。目标范围以本详情单店铺站点演示，不执行真实同步。');}}else if(a==='retry'){let t=tasks.find(x=>x.id===v);t.status='排队中';t.stage='等待重试';t.attempts++;say('演示重试已排队，历史错误应保留在 attempt 日志中；没有发起真实请求。');}else if(a==='cancel'){let t=tasks.find(x=>x.id===v);t.status='已取消';t.stage='停止且不发布';say('演示任务已取消，旧成功快照保留。');}else if(a==='issue'){state.quality=v;}else if(a==='auth-info'){say('配置流程：确认 Seller / 区域 → 现有集成设置受控填写 → 验证参与站点 → 绑定 ERP 店铺 → 检测域能力。多授权能力待 Phase 1。');}render();});
root.addEventListener('change',e=>{let id=e.target.id,val=e.target.value;if(id==='asc-store'||id==='asc-site'){state[id==='asc-store'?'store':'site']=val;state.task=null;state.quality=null;render();say('当前筛选仅作用于演示数据。');}else if(id==='asc-task-status'||id==='asc-task-domain'||id==='asc-task-type'||id==='asc-task-date'){state[{'asc-task-status':'filterStatus','asc-task-domain':'filterDomain','asc-task-type':'filterType','asc-task-date':'filterDate'}[id]]=val;render();}else if(id==='asc-frequency'){root.querySelector('#asc-custom-wrap').hidden=val!=='custom';}else if(id==='asc-mode'){root.querySelector('#asc-report-fields').hidden=val!=='report';}});
root.addEventListener('submit',e=>e.preventDefault());render();
if(globalThis.Tweak){let options={compact:true};let tweak=new Tweak({container:root,onChange:()=>{root.querySelector('main').style.padding=options.compact?'15px':'23px';}});tweak.addToggle(options,'compact',{label:'紧凑内容间距'});}
})();
</script>
