services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://amazon_bulk_ad:amazon_bulk_ad@postgres:5432/amazon_bulk_ad
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: redis
      STORAGE_DRIVER: local
      UPLOAD_DIR: uploads
      AUTH_SECRET: change-this-local-secret-before-production
      BOOTSTRAP_ORG_NAME: Amazon Operations
      BOOTSTRAP_ORG_SLUG: amazon-ops
      BOOTSTRAP_ADMIN_EMAIL: "1"
      BOOTSTRAP_ADMIN_PASSWORD: "1"
      AIGOCODE_API_KEY: ${AIGOCODE_API_KEY}
      AIGOCODE_BASE_URL: ${AIGOCODE_BASE_URL:-https://api.aigocode.app/v1}
      AIGOCODE_MODEL: ${AIGOCODE_MODEL:-gpt-5.4}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://amazon_bulk_ad:amazon_bulk_ad@postgres:5432/amazon_bulk_ad
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: redis
      STORAGE_DRIVER: local
      UPLOAD_DIR: uploads
      WORKER_CONCURRENCY: 2
      AUTH_SECRET: change-this-local-secret-before-production
      AIGOCODE_API_KEY: ${AIGOCODE_API_KEY}
      AIGOCODE_BASE_URL: ${AIGOCODE_BASE_URL:-https://api.aigocode.app/v1}
      AIGOCODE_MODEL: ${AIGOCODE_MODEL:-gpt-5.4}
    command: ["npm", "run", "worker"]
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://amazon_bulk_ad:amazon_bulk_ad@postgres:5432/amazon_bulk_ad
      AUTH_SECRET: change-this-local-secret-before-production
      BOOTSTRAP_ORG_NAME: Amazon Operations
      BOOTSTRAP_ORG_SLUG: amazon-ops
      BOOTSTRAP_ADMIN_EMAIL: "1"
      BOOTSTRAP_ADMIN_PASSWORD: "1"
    command: ["sh", "-c", "npx prisma migrate deploy && npm run db:seed-admin"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amazon_bulk_ad
      POSTGRES_USER: amazon_bulk_ad
      POSTGRES_PASSWORD: amazon_bulk_ad
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amazon_bulk_ad -d amazon_bulk_ad"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  uploads:
