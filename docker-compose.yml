services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amazon_bulk_ad
      POSTGRES_USER: amazon_bulk_ad
      POSTGRES_PASSWORD: amazon_bulk_ad
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amazon_bulk_ad -d amazon_bulk_ad"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
